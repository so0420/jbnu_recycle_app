    - {id: scan2, name: "쓰레기 2번 스캔하기", goal: 2, field: scan_count}
    - {id: raid1, name: "레이드 1번 도전하기", goal: 1, field: raid_count}
    - {id: levelup1, name: "리몬 레벨업 1번", goal: 1, field: levelup_count}
    - {id: exped1, name: "탐사 보내기", goal: 1, field: expedition_sent}
  daily_reward: {coins: 30, xp: 10}
  daily_all_bonus_tickets: 1
  weekly:
    - {id: verify3, name: "배출 인증 3번", goal: 3, reward: capsule}
    - {id: types3, name: "서로 다른 종류 3가지 배출", goal: 3, reward: materials}
    - {id: habit5, name: "올바른 습관 5번", goal: 5, reward: capsule}

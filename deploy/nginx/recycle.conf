# recycle.so4.kr 용 HTTP 레벨 설정 (설치 위치: /etc/nginx/conf.d/recycle.conf)
# 서버 관례: 프로젝트별 map·log_format 은 conf.d 에, server 블록은 sites-available 에 둔다.

# Cloudflare 가 넘겨준 실제 방문자 IP (없으면 연결 IP).
# cloudflare-allow 로 Cloudflare 대역만 들어오므로 이 헤더를 믿어도 된다 (real_ip 모듈은 allow 체크와 충돌하므로 쓰지 않음).
map $http_cf_connecting_ip $recycle_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# 접속 로그: 쿼리스트링을 빼고 경로($uri)만 남긴다.
# 지도·인증 요청 주소에 위치 좌표(lat, lng)가 들어가므로 $request / $request_uri 를 쓰지 않는다 (개인정보 처리방침).
log_format recycle_private '$recycle_client_ip [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $request_time';

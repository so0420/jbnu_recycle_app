# 서버: ~/projects/recycle 에서  ./deploy/deploy.sh
# 앱 127.0.0.1:11010 (nginx → recycle.so4.kr). 사진 판정은 OpenAI API
name: recycle
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: recycle-app
    network_mode: host          # 호스트의 MariaDB(127.0.0.1:3306)에 바로 접속
    env_file: .env
    environment:
      FRONTEND_DIST: /app/frontend/dist
      UPLOAD_DIR: /data/uploads
      LOG_FILE_PATH: /data/logs/
    volumes:
      - ./runtime/uploads:/data/uploads
      - ./runtime/logs:/data/logs
      - ./runtime/apk:/data/apk
    # 서버 메모리가 모자라면(OOM) 이 게임 서버가 가장 먼저 정리되게 한다 (다른 서비스 보호, 최대값 1000)
    oom_score_adj: 1000
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

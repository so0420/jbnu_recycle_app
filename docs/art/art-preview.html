<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리몬 아트 미리보기</title>
<style>
body{margin:0;background:#EEF1EA;color:#1D231F;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:19px;margin:28px 0 10px;border-bottom:1px solid #D3D9D0;padding-bottom:4px}
p.note{margin:0;color:#5B655D;font-size:13px}
.grid{display:grid;gap:10px}
.g-remon{grid-template-columns:repeat(8,1fr)}
.g-boss{grid-template-columns:repeat(5,1fr)}
.g-garden{grid-template-columns:repeat(4,1fr)}
.g-icon{grid-template-columns:repeat(12,1fr)}
.card{background:#F9FAF7;border:1px solid #D3D9D0;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.card .art{width:100%;aspect-ratio:1/1}
.g-garden .card .art{aspect-ratio:360/200}
.card .art svg{width:100%;height:100%;display:block}
.card span{font:11px/1.3 ui-monospace,Consolas,monospace;color:#5B655D;text-align:center;word-break:break-all}
.pair{display:flex;gap:4px;width:100%}
.pair .art{flex:1}
</style>
</head>
<body>
<div class="wrap" id="app">
<h1>리몬 아트 미리보기 (A 스티커)</h1>

<h2>리몬 (보통 · 반짝이)</h2><div class="grid g-remon" id="remon"></div>
<h2>기분 (hurt · happy)</h2><div class="grid g-remon" id="mood"></div>
<h2>보스 (보통 · 피격)</h2><div class="grid g-boss" id="boss"></div>
<h2>정원 (bright / dim)</h2><div class="grid g-garden" id="garden"></div>
<h2>아이콘</h2><div class="grid g-icon" id="icons"></div>
</div>
